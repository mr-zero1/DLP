[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neon-sentinel"
version = "0.1.0"
description = "NEON SENTINEL desktop DLP management UI and endpoint backend"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7", "Flask>=3.0,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
neon-sentinel = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "backend*"]

[tool.setuptools.package-data]
app = ["themes/*.qss", "assets/*"]
